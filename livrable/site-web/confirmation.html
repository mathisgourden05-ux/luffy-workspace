<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Commande confirmée — Road Spirit · Toulon</title>
<meta name="robots" content="noindex"/>
<meta name="theme-color" content="#D4A853"/>
<link rel="icon" href="favicon.svg" type="image/svg+xml"/>
<link rel="manifest" href="manifest.webmanifest"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="Road Spirit"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow+Condensed:wght@500;600;700&family=DM+Sans:opsz,wght@9..40,400;9..40,500&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="shared.css"/>
<script src="shared.js" defer></script>
<style>
body{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center}

.success-wrap{max-width:560px;width:100%}
.check-ring{width:90px;height:90px;border-radius:50%;border:2px solid var(--ok);background:rgba(74,222,128,.07);display:flex;align-items:center;justify-content:center;margin:0 auto 32px}
.check-ring svg{stroke:var(--ok)}
h1{font-family:var(--head);font-size:clamp(52px,10vw,96px);line-height:.88;text-transform:uppercase;letter-spacing:.01em;margin-bottom:16px}
h1 span{color:var(--orange)}
.order-ref{font-family:var(--sub);font-weight:700;letter-spacing:.22em;font-size:13px;text-transform:uppercase;color:var(--orange);background:rgba(201,168,76,.1);border:1px solid rgba(201,168,76,.2);padding:10px 22px;display:inline-block;margin-bottom:28px}
.desc{color:var(--muted);font-size:16px;max-width:420px;margin:0 auto 40px;line-height:1.7}
.actions{display:flex;flex-direction:column;gap:14px;align-items:center}
.btn-main{display:inline-flex;align-items:center;justify-content:center;gap:12px;font-family:var(--sub);font-weight:700;text-transform:uppercase;letter-spacing:.18em;font-size:15px;padding:18px 36px;background:var(--orange);color:#fff;border:0;transition:background .3s;width:100%;max-width:320px}
.btn-main:hover{background:#B8933B}
.btn-ghost{font-family:var(--sub);font-weight:600;letter-spacing:.14em;font-size:13px;text-transform:uppercase;color:var(--muted);transition:color .2s}
.btn-ghost:hover{color:var(--orange)}
.divider{width:1px;height:40px;background:var(--line);margin:8px auto}
.details-box{background:var(--bg-2);border:1px solid var(--line);padding:24px 28px;margin-bottom:32px;text-align:left}
.detail-row{display:flex;justify-content:space-between;align-items:center;font-family:var(--sub);font-size:13px;letter-spacing:.06em;padding:8px 0;border-bottom:1px solid var(--line)}
.detail-row:last-child{border-bottom:0}
.detail-row .label{color:var(--muted);text-transform:uppercase}
.detail-row .val{color:var(--ink);font-weight:700}

.cursor-dot{position:fixed;width:8px;height:8px;background:var(--orange);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%)}
.cursor-ring{position:fixed;width:36px;height:36px;border:1.5px solid rgba(201,168,76,.6);border-radius:50%;pointer-events:none;z-index:9998;transform:translate(-50%,-50%);transition:width .3s,height .3s}
</style>
</head>
<body>

<div class="success-wrap">
  <div class="check-ring">
    <svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"/>
    </svg>
  </div>

  <h1>Commande<br><span>confirmée</span></h1>

  <div class="order-ref" id="orderRef">Référence : —</div>

  <div class="details-box" id="detailsBox" style="display:none">
    <div class="detail-row"><span class="label">Email</span><span class="val" id="detailEmail">—</span></div>
    <div class="detail-row"><span class="label">Montant</span><span class="val" id="detailAmount">—</span></div>
    <div class="detail-row"><span class="label">Statut</span><span class="val" style="color:var(--ok)">Paiement accepté</span></div>
  </div>

  <p class="desc">Merci pour votre achat. Vous allez recevoir un email de confirmation. Notre équipe prépare votre commande.</p>

  <div class="actions">
    <a href="boutique.html" class="btn-main">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2L3 6v14a2 2 0 002 2h14a2 2 0 002-2V6l-3-4z"/><line x1="3" y1="6" x2="21" y2="6"/><path d="M16 10a4 4 0 01-8 0"/></svg>
      Continuer mes achats
    </a>
    <div class="divider"></div>
    <a href="Road Spirit.html" class="btn-ghost">← Retour à l'accueil</a>
  </div>
</div>

<script>
(function(){
  // Vide le panier (la commande est passée)
  localStorage.removeItem('rs_cart');

  // Affiche la référence depuis l'URL (?session=cs_xxx)
  var params = new URLSearchParams(window.location.search);
  var session = params.get('session');
  var refEl = document.getElementById('orderRef');
  if(session && refEl){
    // Génère une ref lisible depuis l'ID de session Stripe
    var ref = 'RS-' + session.replace(/^cs_[a-z]+_/,'').slice(0,10).toUpperCase();
    refEl.textContent = 'Référence : ' + ref;
  }

  // Cursor
  if(window.matchMedia('(pointer:fine)').matches){
    var dot=document.createElement('div');dot.className='cursor-dot';
    var ring=document.createElement('div');ring.className='cursor-ring';
    document.body.appendChild(dot);document.body.appendChild(ring);
    var mx=0,my=0,rx=0,ry=0;
    document.addEventListener('mousemove',function(e){mx=e.clientX;my=e.clientY;dot.style.left=mx+'px';dot.style.top=my+'px';});
    (function lerp(){rx+=(mx-rx)*.14;ry+=(my-ry)*.14;ring.style.left=rx+'px';ring.style.top=ry+'px';requestAnimationFrame(lerp);})();
  }
})();
</script>
</body>
</html>
