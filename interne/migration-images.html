<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<title>Migration images — Road Spirit</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  body{font-family:system-ui,sans-serif;background:#0a0a0a;color:#f5f1e8;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0}
  .box{background:#111;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:40px;max-width:480px;width:100%;text-align:center}
  h1{font-size:20px;margin-bottom:8px;color:#C9A84C}
  p{font-size:14px;color:#888;line-height:1.6;margin-bottom:24px}
  button{background:#C9A84C;color:#000;border:none;padding:14px 28px;font-size:15px;font-weight:700;border-radius:8px;cursor:pointer;width:100%}
  button:disabled{opacity:.5;cursor:not-allowed}
  #status{margin-top:20px;padding:14px;border-radius:8px;font-size:14px;line-height:1.6;display:none}
  .ok{background:rgba(39,174,96,.1);border:1px solid rgba(39,174,96,.3);color:#2ecc71}
  .err{background:rgba(192,57,43,.1);border:1px solid rgba(192,57,43,.3);color:#e74c3c}
  .info{background:rgba(201,168,76,.08);border:1px solid rgba(201,168,76,.2);color:#f5f1e8}
  #login{margin-bottom:24px}
  input{width:100%;background:#0f0f0f;border:1px solid rgba(255,255,255,.1);border-radius:6px;color:#f5f1e8;padding:12px;font-size:14px;margin-bottom:10px;box-sizing:border-box}
</style>
</head>
<body>
<div class="box">
  <h1>Migration des images</h1>
  <p>Transfère toutes les photos du catalogue vers ton Supabase Storage.<br>À faire <strong>une seule fois</strong>, puis supprime cette page.</p>

  <div id="login">
    <input type="email" id="email" placeholder="Email admin" autocomplete="username"/>
    <input type="password" id="pass" placeholder="Mot de passe" autocomplete="current-password"/>
    <button id="btn-login">Se connecter</button>
  </div>

  <button id="btn-migrate" style="display:none">Lancer la migration</button>
  <div id="status"></div>
</div>

<script>
const SUPABASE_URL  = 'https://ywpduxvpbqkyjjatluts.supabase.co';
const SUPABASE_ANON = 'sb_publishable_GOsQwlFx9OpZLHV6REJT6Q_CZD_nxrf';
const { createClient } = supabase;
const db = createClient(SUPABASE_URL, SUPABASE_ANON);

const status = document.getElementById('status');
function show(msg, type){ status.className = type; status.innerHTML = msg; status.style.display = 'block'; }

document.getElementById('btn-login').addEventListener('click', async () => {
  const email = document.getElementById('email').value.trim();
  const pass  = document.getElementById('pass').value;
  if(!email || !pass){ show('Email et mot de passe requis.','err'); return; }
  show('Connexion…','info');
  const { error } = await db.auth.signInWithPassword({ email, password: pass });
  if(error){ show('Erreur : ' + error.message,'err'); return; }
  document.getElementById('login').style.display = 'none';
  document.getElementById('btn-migrate').style.display = 'block';
  show('Connecté. Clique sur "Lancer la migration".','ok');
});

document.getElementById('btn-migrate').addEventListener('click', async () => {
  const btn = document.getElementById('btn-migrate');
  btn.disabled = true; btn.textContent = 'Migration en cours…';
  show('Téléchargement et upload des photos… 1-2 minutes environ.','info');
  try {
    const { data, error } = await db.functions.invoke('migrate-images', { body: {} });
    if(error) throw new Error(error.message);
    if(data && data.error) throw new Error(data.error);
    const d = data || {};
    if(d.message === 'Rien à migrer'){
      show('✓ Toutes les images sont déjà dans Supabase. Rien à faire.','ok');
    } else {
      const errTxt = d.errors && d.errors.length
        ? `<br><small style="opacity:.7">Erreurs (${d.errors.length}) : ${d.errors.slice(0,5).join(', ')}${d.errors.length>5?' …':''}</small>`
        : '';
      show(`✓ Terminé — ${d.migrated} photo(s) migrée(s), ${d.skipped} déjà OK.${errTxt}`, 'ok');
    }
  } catch(e) {
    show('Erreur : ' + e.message,'err');
    btn.disabled = false; btn.textContent = 'Réessayer';
  }
});
</script>
</body>
</html>
